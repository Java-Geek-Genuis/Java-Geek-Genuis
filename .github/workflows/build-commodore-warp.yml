name: Build Commodore Warp ARM32 appx
# Verified ARM32 UWP packaging pipeline

on:
  push:
    branches:
      - commodore-warp-uwp
      - commodore-warp-package
    paths:
      - "CommodoreWarpUWP/**"
      - ".github/workflows/build-commodore-warp.yml"
  workflow_dispatch:

concurrency:
  group: commodore-warp-package-${{ github.sha }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build VICE ARM32 C64 core
        shell: pwsh
        working-directory: CommodoreWarpUWP
        run: .\build-vice-arm.ps1 -EmuType x64

      - name: Build VICE ARM32 C128 core
        shell: pwsh
        working-directory: CommodoreWarpUWP
        run: .\build-vice-arm.ps1 -EmuType x128

      - name: Stage VICE cores
        shell: pwsh
        working-directory: CommodoreWarpUWP
        run: |
          New-Item -ItemType Directory -Force .\CommodoreWarpUWP\Cores | Out-Null
          Copy-Item .\ThirdParty\vice-libretro\vice_x64_libretro.dll .\CommodoreWarpUWP\Cores\vice_x64_libretro.dll -Force
          Copy-Item .\ThirdParty\vice-libretro\vice_x128_libretro.dll .\CommodoreWarpUWP\Cores\vice_x128_libretro.dll -Force
          Get-ChildItem .\CommodoreWarpUWP\Cores\*.dll | Select-Object Name,Length

      - name: Build ARM32 binaries
        shell: pwsh
        working-directory: CommodoreWarpUWP
        run: |
          msbuild CommodoreWarpUWP.sln /m:1 /t:Rebuild /p:Configuration=Release /p:Platform=ARM /v:minimal

      - name: Collect MSBuild-generated ARM32 appx
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $out | Out-Null
          $pkg = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'CommodoreWarpUWP\AppPackages') -Recurse -Filter 'CommodoreWarpUWP_*_ARM.appx' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$pkg) { Write-Error 'MSBuild did not generate an ARM32 .appx package.' }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($pkg.FullName)
          $names = $zip.Entries.FullName
          $zip.Dispose()
          if ($names -notcontains 'Cores/vice_x64_libretro.dll' -or $names -notcontains 'Cores/vice_x128_libretro.dll') { Write-Error 'ARM32 VICE core DLLs are missing from AppX.' }
          Copy-Item $pkg.FullName (Join-Path $out 'CommodoreWarp_ARM32.appx') -Force
          $cert = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'CommodoreWarpUWP\AppPackages') -Recurse -Filter '*.cer' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($cert) { Copy-Item $cert.FullName (Join-Path $out $cert.Name) -Force }

      - name: Verify package
        shell: pwsh
        run: |
          $pkg = Join-Path $env:GITHUB_WORKSPACE 'artifacts\CommodoreWarp_ARM32.appx'
          if (!(Test-Path $pkg)) { Write-Error 'Package missing.' }
          Get-Item $pkg | Select-Object FullName,Length


      - name: Upload ARM32 appx
        uses: actions/upload-artifact@v4
        with:
          name: Commodore-Warp-ARM32-appx
          path: artifacts/*
          if-no-files-found: error
