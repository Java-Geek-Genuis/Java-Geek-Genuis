name: Build Commodore Warp ARM32 appx
# Testable ARM32 package pipeline
#
# The current VICE libretro source no longer exposes the legacy UWP/MSVC
# build target. For a testable Windows Phone package, use the preserved
# ARM32/MSVC VICE binaries from the public RetroArch-ARM core archive.

on:
  push:
    branches:
      - commodore-warp-uwp
      - commodore-warp-package
    paths:
      - "CommodoreWarpUWP/**"
      - ".github/workflows/build-commodore-warp.yml"
  workflow_dispatch:

concurrency:
  group: commodore-warp-package-\${{ github.sha }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download ARM32 VICE C64/C128 cores
        shell: pwsh
        working-directory: CommodoreWarpUWP
        run: |
          New-Item -ItemType Directory -Force .\CommodoreWarpUWP\Cores | Out-Null

          $base = "https://raw.githubusercontent.com/basharast/RetroArch-ARM/894812d2f8a9435ef77e9ae6bc57e303eb45aa32/cores/msvc-cores"
          Invoke-WebRequest "$base/vice_x64_libretro.dll" -OutFile .\CommodoreWarpUWP\Cores\vice_x64_libretro.dll
          Invoke-WebRequest "$base/vice_x128_libretro.dll" -OutFile .\CommodoreWarpUWP\Cores\vice_x128_libretro.dll

          foreach ($f in @(".\CommodoreWarpUWP\Cores\vice_x64_libretro.dll", ".\CommodoreWarpUWP\Cores\vice_x128_libretro.dll")) {
            if (!(Test-Path $f)) { throw "Missing VICE core: $f" }
            $b = [System.IO.File]::ReadAllBytes((Resolve-Path $f))
            if ($b.Length -lt 64 -or $b[0] -ne 0x4D -or $b[1] -ne 0x5A) { throw "Not a PE DLL: $f" }
            $pe = [BitConverter]::ToInt32($b, 0x3C)
            $machine = [BitConverter]::ToUInt16($b, $pe + 4)
            if ($machine -ne 0x1C4) { throw ("Expected ARM32 DLL (0x1C4), got 0x{0:X}" -f $machine) }
            Write-Host ("Verified ARM32 VICE core: {0} ({1} bytes)" -f $f, $b.Length)
          }

      - name: Build ARM32 binaries
        shell: pwsh
        working-directory: CommodoreWarpUWP
        run: |
          msbuild CommodoreWarpUWP.sln /m:1 /t:Rebuild /p:Configuration=Release /p:Platform=ARM /v:minimal

      - name: Sign ARM32 AppX for sideload testing
        shell: pwsh
        working-directory: CommodoreWarpUWP
        run: |
          $pkg = Get-ChildItem .\AppPackages -Recurse -Filter "CommodoreWarpUWP_*_ARM.appx" -File | Select-Object -First 1
          if (!$pkg) { throw "ARM32 AppX not found." }

          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Java-Geek-Genuis" -FriendlyName "Commodore Warp Test Certificate" -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -KeyExportPolicy NonExportable -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(3) -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          $cer = Join-Path $env:GITHUB_WORKSPACE "CommodoreWarpUWP\CommodoreWarp_Test.cer"
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null

          $signtool = Get-ChildItem "$env:ProgramFiles(x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (!$signtool) { throw "signtool.exe not found." }

          & $signtool.FullName sign /fd SHA256 /a /n "Java-Geek-Genuis" $pkg.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool failed." }

          $z = [System.IO.Compression.ZipFile]::OpenRead($pkg.FullName)
          $hasSig = $z.Entries.FullName -contains "AppxSignature.p7x"
          $z.Dispose()
          if (!$hasSig) { throw "Signed AppX does not contain AppxSignature.p7x." }

      - name: Collect MSBuild-generated ARM32 appx
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $out | Out-Null

          $pkg = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE "CommodoreWarpUWP\AppPackages") -Recurse -Filter "CommodoreWarpUWP_*_ARM.appx" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$pkg) { Write-Error "MSBuild did not generate an ARM32 .appx package." }

          $zip = [System.IO.Compression.ZipFile]::OpenRead($pkg.FullName)
          $names = @($zip.Entries.FullName)
          $zip.Dispose()

          if ($names -notcontains "Cores/vice_x64_libretro.dll" -or $names -notcontains "Cores/vice_x128_libretro.dll") {
            Write-Error "ARM32 VICE core DLLs are missing from AppX."
          }

          Copy-Item $pkg.FullName (Join-Path $out "CommodoreWarp_ARM32.appx") -Force

          $cert = Join-Path $env:GITHUB_WORKSPACE "CommodoreWarpUWP\CommodoreWarp_Test.cer"
          if (Test-Path $cert) { Copy-Item $cert (Join-Path $out "CommodoreWarp_Test.cer") -Force }

      - name: Verify package
        shell: pwsh
        run: |
          $pkg = Join-Path $env:GITHUB_WORKSPACE "artifacts\CommodoreWarp_ARM32.appx"
          if (!(Test-Path $pkg)) { Write-Error "Package missing." }
          Get-Item $pkg | Select-Object FullName,Length
          $zip = [System.IO.Compression.ZipFile]::OpenRead($pkg)
          $entries = $zip.Entries.FullName
          $zip.Dispose()
          "Cores/vice_x64_libretro.dll","Cores/vice_x128_libretro.dll","Assets/logo.png","AppxManifest.xml" | ForEach-Object {
            if ($entries -notcontains $_) { Write-Error "Missing package entry: $_" }
          }

      - name: Upload ARM32 appx
        uses: actions/upload-artifact@v4
        with:
          name: Commodore-Warp-ARM32-appx
          path: artifacts/*
          if-no-files-found: error
