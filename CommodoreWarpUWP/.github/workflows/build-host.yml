name: Build Commodore Warp host
on:
  push:
    paths:
      - "CommodoreWarpUWP/**"
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: CommodoreWarpUWP
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2
      - name: Build ARM host
        run: msbuild CommodoreWarpUWP.sln /m /p:Configuration=Release /p:Platform=ARM /p:AppxPackageSigningEnabled=false
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Get-ChildItem . -Recurse -Include *.appx,*.appxbundle,*.msixbundle -File | ForEach-Object { Copy-Item $_.FullName artifacts -Force }
      - uses: actions/upload-artifact@v4
        with:
          name: Commodore-Warp-ARM32-host
          path: CommodoreWarpUWP/artifacts/*
          if-no-files-found: error
